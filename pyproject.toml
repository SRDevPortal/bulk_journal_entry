[project]
name = "bulk_journal_entry"
version = "0.0.1"
description = "Bulk settlement Journal Entries for collection payments in ERPNext"
authors = [
  { name = "SRIAAS", email = "webdevelopersriaas@gmail.com" }
]

readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # "frappe~=15.0.0"  # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B017", "B018", "B023", "B904", "E101", "E402", "E501", "E741", "F401", "F403", "F405", "F722", "W191"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
